# 1. MONITORS

monitor = , preferred, auto, 1.0

# 2. DEFAULT PROGRAMS & VARIABLES

$mainMod        = SUPER
$terminal       = kitty
$fileManager    = thunar
$menu           = caelestia shell drawers toggle launcher
$browser        = zen-beta
$code           = code
$snip           = hyprshot -m region

# 3. AUTOSTART

# caelestia-shell KHÔNG cần khai báo ở đây: tự khởi động qua systemd user
# service (programs.caelestia.systemd.enable) cùng graphical-session.target.
exec-once = uwsm app -- fcitx5 -d -r
# Tự khóa màn hình ngay khi vào phiên (autologinUser bỏ qua màn hình đăng
# nhập). Retry tới khi IPC socket của caelestia sẵn sàng, tránh race condition.
exec-once = uwsm app -- bash -c 'until caelestia shell lock lock 2>/dev/null; do sleep 0.5; done'

# 4. ENVIRONMENT VARIABLES

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx

# Themes & Cursors
env = GTK_THEME, catppuccin-mocha-pink-standard
env = QS_ICON_THEME, besgnulinux-mono-pink
env = XCURSOR_THEME, Adwaita
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

# 5. LOOK AND FEEL

general {
    gaps_in = 3
    gaps_out = 4
    border_size = 2

    col.active_border = rgba(FF10F0ee)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# 6. INPUT & CURSOR

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    repeat_rate = 35
    repeat_delay = 200

    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout = 30
    no_hardware_cursors = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# 7. KEYBINDINGS

# --- Application Launchers ---
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, P, exec, $code
bind = $mainMod, grave, exec, $menu
bind = $mainMod, S, exec, $snip

# --- Window Management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, W, togglefloating,

# --- Focus Movement (Vim Keys) ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# --- Switch Workspaces (1 - 10) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move Active Window to Workspace (1 - 10) ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Mouse Bindings ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Media Keys ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Screenshot ---
bind = , Print, exec, $snip